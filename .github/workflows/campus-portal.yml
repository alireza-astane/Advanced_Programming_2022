name: Campus Portal

on:
  push:
    branches: [main]
    paths: ['campus-portal/**', '.github/workflows/campus-portal.yml']
  pull_request:
    paths: ['campus-portal/**', '.github/workflows/campus-portal.yml']

defaults:
  run:
    working-directory: campus-portal

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test
