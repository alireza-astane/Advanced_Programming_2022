name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            type: deb
          - os: windows-latest
            type: app-image
            archive: Generals-windows.zip
          - os: macos-latest
            type: app-image
            archive: Generals-macos.zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew packageApp -PpackageType=${{ matrix.type }}
      - if: matrix.archive
        working-directory: build/package
        run: tar -a -cf ${{ matrix.archive }} Generals*
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            build/package/*.deb
            build/package/*.zip
