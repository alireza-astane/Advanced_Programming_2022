name: Generals

on:
  push:
    branches: [main]
    paths: ['generals/**', '.github/workflows/generals.yml']
  pull_request:
    paths: ['generals/**', '.github/workflows/generals.yml']

defaults:
  run:
    working-directory: generals

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test

