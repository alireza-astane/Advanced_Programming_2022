apply plugin: 'application'

def os = System.getProperty('os.name').toLowerCase()
def arch = System.getProperty('os.arch')
def javafxPlatform = os.contains('win') ? 'win'
        : os.contains('mac') ? (arch == 'aarch64' ? 'mac-aarch64' : 'mac')
        : (arch == 'aarch64' ? 'linux-aarch64' : 'linux')

dependencies {
    implementation project(':common')
    for (module in ['base', 'graphics', 'controls']) {
        implementation "org.openjfx:javafx-$module:$javafxVersion:$javafxPlatform"
    }
    testRuntimeOnly 'org.testfx:openjfx-monocle:21.0.2'
    testImplementation "org.openjfx:javafx-swing:$javafxVersion:$javafxPlatform"
}

application {
    mainClass = 'ClientMain'
}

test {
    filter { excludeTestsMatching 'ui.ScreenTour' }
    dependsOn ':server:classes'
    doFirst {
        systemProperty 'server.classpath', project(':server').sourceSets.main.runtimeClasspath.asPath
    }
    systemProperty 'testfx.headless', 'true'
    systemProperty 'glass.platform', 'Monocle'
    systemProperty 'monocle.platform', 'Headless'
    systemProperty 'headless.geometry', '1600x1000-32'
    systemProperty 'prism.order', 'sw'
}

// Builds a self-contained client. The JDK used must include jmods.
tasks.register('packageApp', Exec) {
    dependsOn 'installDist'
    def javaHome = javaToolchains.launcherFor(java.toolchain).get().metadata.installationPath.asFile
    def output = layout.buildDirectory.dir('package').get().asFile
    doFirst {
        delete output
    }
    executable new File(javaHome, 'bin/jpackage')
    args '--type', project.findProperty('packageType') ?: 'app-image',
            '--name', 'CampusPortal',
            '--app-version', version,
            '--input', layout.buildDirectory.dir('install/client/lib').get().asFile.path,
            '--main-jar', "client-${version}.jar",
            '--main-class', 'ClientMain',
            '--add-modules', 'java.base,java.desktop,java.logging,java.management,java.naming,java.scripting,java.sql,java.xml,jdk.unsupported',
            '--dest', output.path
}

tasks.register('screenshots', Test) {
    description = 'Renders every screen into docs/screens, using the demo data.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter { includeTestsMatching 'ui.ScreenTour' }
    dependsOn ':server:classes'
    outputs.upToDateWhen { false }
    doFirst {
        systemProperty 'server.classpath', project(':server').sourceSets.main.runtimeClasspath.asPath
    }
    systemProperty 'portal.screenshots', rootProject.file('docs/screens').path
    systemProperty 'testfx.headless', 'true'
    systemProperty 'glass.platform', 'Monocle'
    systemProperty 'monocle.platform', 'Headless'
    systemProperty 'headless.geometry', '1600x1000-32'
    systemProperty 'prism.order', 'sw'
}
